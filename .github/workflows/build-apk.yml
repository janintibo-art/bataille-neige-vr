name: Build APK Quest 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  VENDORS_VERSION: "5.1.0"
  EXPORT_NAME: "bataille-neige-vr"

jobs:
  build:
    name: Build Quest 3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot et plugin Quest
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-vendors-${{ env.VENDORS_VERSION }}

      - name: Telecharger Godot, modeles Android et plugin Quest
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p ~/godot-cache
          cd ~/godot-cache
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p templates
          unzip -qj templates.tpz 'templates/android_*' 'templates/version.txt' -d templates
          rm templates.tpz
          curl -fsSL -o vendors.zip "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${VENDORS_VERSION}-stable/godotopenxrvendorsaddon.zip"
          mkdir -p vendors
          unzip -q vendors.zip -d vendors
          rm vendors.zip

      - name: Installer Godot, plugin Quest et SDK Android
        shell: bash
        run: |
          set -e
          chmod +x ~/godot-cache/godot
          sudo ln -sf "$HOME/godot-cache/godot" /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          cp ~/godot-cache/templates/* "$TPL/"
          mkdir -p addons
          cp -r ~/godot-cache/vendors/asset/addons/godotopenxrvendors addons/
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" > /dev/null
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
          godot --version

      - name: Importer le projet
        shell: bash
        run: |
          godot --headless --import > import.log 2>&1 || true
          cat import.log
          if grep -qE "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      - name: Creer la cle debug Android
        shell: bash
        run: |
          mkdir -p keys
          keytool -genkeypair -v -keystore keys/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bataille Neige VR,O=janintibo,C=FR" > /dev/null 2>&1

      - name: Compiler APK Quest 3
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/keys/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          mkdir -p build/android
          godot --headless --install-android-build-template --export-debug "Quest 3" "build/android/${EXPORT_NAME}.apk" 2>&1 | tee export.log
          test -s "build/android/${EXPORT_NAME}.apk"

      - name: Garder APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: bataille-neige-vr-quest3-apk
          path: build/android/bataille-neige-vr.apk
          if-no-files-found: error
